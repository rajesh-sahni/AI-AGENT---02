<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Chat - Ollama + Llama</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-message-user: #2d2d2d;
      --bg-message-ai: #252525;
      --text-primary: #e4e4e4;
      --text-secondary: #a0a0a0;
      --accent: #10a37f;
      --border: #333;
      --input-bg: #2d2d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    header {
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    #chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 42rem;
      margin: 0 auto;
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 0.75rem;
      line-height: 1.6;
    }

    .message.user {
      background: var(--bg-message-user);
      align-self: flex-end;
      border: 1px solid var(--border);
    }

    .message.assistant {
      background: var(--bg-message-ai);
      align-self: flex-start;
      border: 1px solid var(--border);
    }

    .message .role {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .message .content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.loading .content::after {
      content: "";
      display: inline-block;
      width: 4px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    #input-area {
      flex-shrink: 0;
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    #input-form {
      max-width: 42rem;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    #message-input {
      flex: 1;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      resize: none;
      min-height: 48px;
      max-height: 200px;
    }

    #message-input::placeholder {
      color: var(--text-secondary);
    }

    #message-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #send-btn {
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--accent);
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #send-btn:hover {
      opacity: 0.9;
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      background: #3d1f1f;
      border-color: #5c2d2d;
      color: #f88;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <header>
      <h1>AI Agent Chat</h1>
      <p>Chat with Llama & other models via Ollama</p>
    </header>
  </div>

  <div id="chat-container"></div>

  <div id="input-area">
    <form id="input-form">
      <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-form');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    let chatHistory = [];

    function addMessage(role, content, loading = false) {
      const div = document.createElement('div');
      div.className = `message ${role}${loading ? ' loading' : ''}`;
      div.innerHTML = `
        <div class="role">${role}</div>
        <div class="content">${content || ''}</div>
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function addError(msg) {
      const div = addMessage('assistant', msg);
      div.classList.add('error');
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      messageInput.value = '';
      sendBtn.disabled = true;

      addMessage('user', text);
      const loadingDiv = addMessage('assistant', '', true);

      const payload = {
        message: text.trim(),
        model: 'deepseek-r1:1.5b',
        history: chatHistory,
        stream: false
      };

      try {
        const res = await fetch('/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok) {
          addError(data.detail || 'Something went wrong');
          loadingDiv.remove();
          return;
        }

        loadingDiv.classList.remove('loading');
        loadingDiv.querySelector('.content').textContent = data.message;

        chatHistory.push({ role: 'user', content: text.trim() });
        chatHistory.push({ role: 'assistant', content: data.message });
      } catch (err) {
        addError('Network error. Is Ollama running? Try: ollama serve');
        loadingDiv.remove();
      } finally {
        sendBtn.disabled = false;
      }
    }

    inputForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(messageInput.value);
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(messageInput.value);
      }
    });
  </script>
</body>
</html>
